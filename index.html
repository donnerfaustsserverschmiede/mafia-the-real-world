<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>MAFIVERA – Die Welt gehört dir</title><link rel="icon" href="./assets/mafivera-logo.webp"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="./mafivera-map-theme.css?v=4"><link rel="stylesheet" href="./game-core.css?v=1"><link rel="stylesheet" href="./map-ui.css?v=1">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.auth-screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 15%,#2b2410 0,#111 38%,#070707 75%)}.auth-card{width:min(440px,100%);padding:28px 24px 22px;background:rgba(18,18,18,.97);border:1px solid #4a4a4a;border-radius:22px;box-shadow:0 24px 80px #000c}.auth-logo{text-align:center;margin-bottom:10px}.auth-logo img{display:block;width:min(300px,85%);height:auto;margin:0 auto;filter:drop-shadow(0 10px 24px #000)}h1{margin:8px 0 6px;text-align:center;font-size:25px}.subtitle{text-align:center;color:#aaa;font-size:14px;line-height:1.45;margin:0 0 22px}.field{margin-top:12px}.field label{display:block;color:#bbb;font-size:12px;font-weight:700;margin:0 0 6px 3px}.field input{width:100%;height:50px;border:1px solid #454545;border-radius:12px;background:#0d0d0d;color:#fff;padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:#d6ad2d;box-shadow:0 0 0 2px #d6ad2d22}.hidden{display:none!important}button{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#d6ad2d;color:#111}.secondary{background:#292929;color:#fff;border:1px solid #444}.link{background:transparent;color:#aaa;height:auto;margin-top:12px;font-weight:600}.message{min-height:22px;margin-top:12px;text-align:center;color:#d6ad2d;font-size:13px;line-height:1.4}.foot{text-align:center;color:#666;font-size:11px;margin-top:16px}.game-root{position:fixed;inset:0;display:none;overflow:hidden}
</style>
</head>
<body>
<section id="authScreen" class="auth-screen"><div class="auth-card"><div class="auth-logo"><img src="./assets/mafivera-logo.webp" alt="MAFIVERA"></div><h1 id="authTitle">Willkommen zurück</h1><p id="authSubtitle" class="subtitle">Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.</p><form id="authForm" novalidate><div class="field"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div><div class="field"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><div id="usernameField" class="field hidden"><label for="username">Nutzername</label><input id="username" type="text" autocomplete="username" maxlength="24" pattern="[A-Za-z0-9_.-]{3,24}" placeholder="Dein Nutzername"></div><button id="submitButton" class="primary" type="submit">🔐 Anmelden</button></form><button id="modeButton" class="secondary" type="button">📝 Registrieren</button><button id="forgotButton" class="link" type="button">Passwort vergessen?</button><div id="authMessage" class="message" aria-live="polite"></div><div class="foot">MAFIVERA · DIE WELT GEHÖRT DIR</div></div></section>
<section id="gameRoot" class="game-root"></section>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://ufqdntsxgqcxtszufbtv.supabase.co',SUPABASE_KEY='sb_publishable_PDao9J9Pz87uSotESNeGbg_GSGh5u49';window.SUPABASE_KEY=SUPABASE_KEY;
const authScreen=document.getElementById('authScreen'),root=document.getElementById('gameRoot'),form=document.getElementById('authForm'),uf=document.getElementById('usernameField'),un=document.getElementById('username'),title=document.getElementById('authTitle'),sub=document.getElementById('authSubtitle'),submit=document.getElementById('submitButton'),modeBtn=document.getElementById('modeButton'),forgot=document.getElementById('forgotButton'),msg=document.getElementById('authMessage');let mode='login',db=null,lastBootError='';
const message=(t,e=false)=>{msg.textContent=t||'';msg.style.color=e?'#ff8b8b':'#d6ad2d'};
window.addEventListener('error',e=>{lastBootError=String(e?.error?.stack||e?.message||'Unbekannter JavaScript-Fehler');console.error('[MAFIVERA]',lastBootError)});
window.addEventListener('unhandledrejection',e=>{lastBootError=String(e?.reason?.stack||e?.reason?.message||e?.reason||'Unbehandelte Promise-Fehler');console.error('[MAFIVERA]',lastBootError)});
const waitForGame=()=>{let n=0;const tick=()=>{if(root.querySelector('.mafivera-game')){authScreen.style.display='none';root.style.display='block';return}if(lastBootError){root.style.display='none';authScreen.style.display='flex';message('Spiel konnte nicht gestartet werden: '+lastBootError.split('\n')[0],true);return}if(++n>=160){root.style.display='none';authScreen.style.display='flex';message('Spiel konnte nicht gestartet werden. Bitte Seite neu laden.',true);return}setTimeout(tick,50)};tick()};
const load=s=>new Promise((r,j)=>{const x=document.createElement('script');x.src=s;x.onload=r;x.onerror=j;document.head.appendChild(x)});
const showGame=session=>{if(!session?.user)return;root.style.display='block';authScreen.style.display='flex';lastBootError='';if(!window.gameShellLoaded){window.gameShellLoaded=true;const s=document.createElement('script');s.src='./game.js?v=30';s.onload=async()=>{try{await load('./buildings.js?v=1')}catch(e){console.error('[MAFIVERA buildings]',e)}waitForGame()};s.onerror=()=>{window.gameShellLoaded=false;root.style.display='none';authScreen.style.display='flex';message('game.js konnte nicht geladen werden.',true)};document.body.appendChild(s)}else waitForGame()};
async function boot(){message('Verbindung wird hergestellt…');try{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){try{await load('https://unpkg.com/@supabase/supabase-js@2')}catch(e2){message('Supabase konnte nicht geladen werden. Bitte Seite neu laden.',true);return}}if(!window.supabase){message('Supabase konnte nicht geladen werden.',true);return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.db=db;message('');try{const cur=await db.auth.getSession();if(cur.data?.session){showGame(cur.data.session);return}}catch(e){message(String(e?.message||e),true);return}db.auth.onAuthStateChange((_e,s)=>{if(s)showGame(s)})};
form.addEventListener('submit',async e=>{e.preventDefault();if(!db){message('Verbindung wird noch hergestellt…',true);return}const em=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value,u=un.value.trim();if(!em||!pw)return message('Bitte E-Mail-Adresse und Passwort eingeben.',true);if(pw.length<8)return message('Das Passwort muss mindestens 8 Zeichen lang sein.',true);if(mode==='register'&&!/^[A-Za-z0-9_.-]{3,24}$/.test(u))return message('Der Nutzername muss 3–24 Zeichen lang sein und darf nur Buchstaben, Zahlen, Punkt, Bindestrich oder Unterstrich enthalten.',true);submit.disabled=modeBtn.disabled=forgot.disabled=true;try{if(mode==='register'){const r=await db.auth.signUp({email:em,password:pw,options:{data:{username:u}}});if(r.error)throw r.error;if(!r.data.session)return message('Konto erstellt, aber keine Sitzung erhalten. Bitte prüfe „Confirm email“.',true);showGame(r.data.session)}else{const r=await db.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;showGame(r.data.session)}}catch(err){const m=String(err?.message||err);message(/invalid login credentials/i.test(m)?'E-Mail oder Passwort ist falsch.':/email not confirmed/i.test(m)?'Die E-Mail-Adresse wurde noch nicht bestätigt.':/already registered/i.test(m)?'Für diese E-Mail existiert bereits ein Konto. Bitte anmelden.':m,true)}finally{submit.disabled=modeBtn.disabled=forgot.disabled=false}});
modeBtn.onclick=()=>{mode=mode==='login'?'register':'login';const reg=mode==='register';uf.classList.toggle('hidden',!reg);un.required=reg;title.textContent=reg?'Konto erstellen':'Willkommen zurück';sub.textContent=reg?'Erstelle deinen neuen MAFIVERA-Spieler.':'Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.';submit.textContent=reg?'🚀 Registrieren':'🔐 Anmelden';modeBtn.textContent=reg?'↩️ Zur Anmeldung':'📝 Registrieren';forgot.classList.toggle('hidden',reg);message('')};
forgot.onclick=async()=>{const em=document.getElementById('email').value.trim().toLowerCase();if(!em)return message('Bitte zuerst deine E-Mail-Adresse eingeben.',true);const r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});message(r.error?String(r.error.message):'Wenn ein Konto mit dieser E-Mail existiert, wurde der Passwort-Reset angefordert.',!!r.error)};boot()})();
</script>
<script src="./logs.js?v=5"></script><script src="./recruitment.js?v=3"></script>
</body></html>
