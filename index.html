<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>MAFIVERA – Die Welt gehört dir</title>
<link rel="icon" href="./assets/mafivera-logo.webp">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.auth-screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 15%,#2b2410 0,#111 38%,#070707 75%)}.auth-card{width:min(440px,100%);padding:28px 24px 22px;background:rgba(18,18,18,.97);border:1px solid #4a4a4a;border-radius:22px;box-shadow:0 24px 80px #000c}.auth-logo{text-align:center;margin-bottom:10px}.auth-logo img{display:block;width:min(300px,85%);height:auto;margin:0 auto;filter:drop-shadow(0 10px 24px #000)}h1{margin:8px 0 6px;text-align:center;font-size:25px}.subtitle{text-align:center;color:#aaa;font-size:14px;line-height:1.45;margin:0 0 22px}.field{margin-top:12px}.field label{display:block;color:#bbb;font-size:12px;font-weight:700;margin:0 0 6px 3px}.field input{width:100%;height:50px;border:1px solid #454545;border-radius:12px;background:#0d0d0d;color:#fff;padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:#d6ad2d;box-shadow:0 0 0 2px #d6ad2d22}.hidden{display:none!important}button{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#d6ad2d;color:#111}.secondary{background:#292929;color:#fff;border:1px solid #444}.link{background:transparent;color:#aaa;height:auto;margin-top:12px;font-weight:600}.link:hover{color:#fff}.message{min-height:22px;margin-top:12px;text-align:center;color:#d6ad2d;font-size:13px;line-height:1.4}.foot{text-align:center;color:#666;font-size:11px;margin-top:16px}.game{min-height:100%;display:none;align-items:center;justify-content:center;background:#080808}.game-card{width:min(500px,calc(100% - 32px));padding:24px;background:#151515;border:1px solid #444;border-radius:18px;text-align:center}.game-card img{width:180px;max-width:70%}.game-card p{color:#aaa}.logout{background:#542020;color:#fff}
</style>
</head>
<body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><img src="./assets/mafivera-logo.webp" alt="MAFIVERA"></div>
    <h1 id="authTitle">Willkommen zurück</h1>
    <p id="authSubtitle" class="subtitle">Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.</p>
    <form id="authForm" novalidate>
      <div class="field"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div id="usernameField" class="field hidden"><label for="username">Nutzername</label><input id="username" type="text" autocomplete="username" maxlength="24" pattern="[A-Za-z0-9_.-]{3,24}" placeholder="Dein Nutzername"></div>
      <button id="submitButton" class="primary" type="submit">🔐 Anmelden</button>
    </form>
    <button id="modeButton" class="secondary" type="button">📝 Registrieren</button>
    <button id="forgotButton" class="link" type="button">Passwort vergessen?</button>
    <div id="authMessage" class="message" aria-live="polite"></div>
    <div class="foot">MAFIVERA · DIE WELT GEHÖRT DIR</div>
  </div>
</section>
<section id="gameScreen" class="game">
  <div class="game-card"><img src="./assets/mafivera-logo.webp" alt="MAFIVERA"><h2>Angemeldet</h2><p id="welcomeUser"></p><p>Der eigentliche Spielbereich wird als nächster Schritt aufgebaut.</p><button id="logoutButton" class="logout">Abmelden</button></div>
</section>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://ufqdntsxgqcxtszufbtv.supabase.co';
const SUPABASE_KEY='sb_publishable_PDao9J9Pz87uSotESNeGbg_GSGh5u49';
const load=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
const authScreen=document.getElementById('authScreen'),gameScreen=document.getElementById('gameScreen'),form=document.getElementById('authForm'),usernameField=document.getElementById('usernameField'),username=document.getElementById('username'),title=document.getElementById('authTitle'),subtitle=document.getElementById('authSubtitle'),submit=document.getElementById('submitButton'),modeButton=document.getElementById('modeButton'),forgot=document.getElementById('forgotButton'),message=document.getElementById('authMessage');
let mode='login',db=null;
const setMessage=(text,error=false)=>{message.textContent=text||'';message.style.color=error?'#ff8b8b':'#d6ad2d'};
const setMode=(next)=>{mode=next;const register=mode==='register';usernameField.classList.toggle('hidden',!register);username.required=register;title.textContent=register?'Konto erstellen':'Willkommen zurück';subtitle.textContent=register?'Erstelle deinen neuen MAFIVERA-Spieler.':'Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.';submit.textContent=register?'🚀 Registrieren':'🔐 Anmelden';modeButton.textContent=register?'↩️ Zur Anmeldung':'📝 Registrieren';forgot.classList.toggle('hidden',register);setMessage('');};
const showGame=(session)=>{if(!session?.user)return;authScreen.style.display='none';gameScreen.style.display='flex';const name=session.user.user_metadata?.username||session.user.email?.split('@')[0]||'Spieler';document.getElementById('welcomeUser').textContent='Willkommen, '+name+'!';};
async function boot(){setMessage('Verbindung wird hergestellt…');try{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){try{await load('https://unpkg.com/@supabase/supabase-js@2')}catch(e2){setMessage('Supabase konnte nicht geladen werden. Bitte Seite neu laden.',true);return}}if(!window.supabase){setMessage('Supabase konnte nicht geladen werden.',true);return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.db=db;setMessage('');const current=await db.auth.getSession();if(current.data?.session){showGame(current.data.session);return}db.auth.onAuthStateChange((_event,session)=>{if(session)showGame(session)});}
form.addEventListener('submit',async(e)=>{e.preventDefault();if(!db){setMessage('Verbindung wird noch hergestellt…',true);return}const em=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value,un=username.value.trim();if(!em||!pw){setMessage('Bitte E-Mail-Adresse und Passwort eingeben.',true);return}if(pw.length<8){setMessage('Das Passwort muss mindestens 8 Zeichen lang sein.',true);return}if(mode==='register'&&!/^[A-Za-z0-9_.-]{3,24}$/.test(un)){setMessage('Der Nutzername muss 3–24 Zeichen lang sein und darf nur Buchstaben, Zahlen, Punkt, Bindestrich oder Unterstrich enthalten.',true);return}submit.disabled=true;modeButton.disabled=true;forgot.disabled=true;try{if(mode==='register'){setMessage('Konto wird erstellt…');const r=await db.auth.signUp({email:em,password:pw,options:{data:{username:un}}});if(r.error)throw r.error;if(!r.data.session){setMessage('Konto erstellt. Bitte prüfe deine E-Mail-Bestätigung.',true);return}showGame(r.data.session)}else{setMessage('Anmeldung wird geprüft…');const r=await db.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;showGame(r.data.session)}}catch(err){const m=String(err?.message||err);if(/invalid login credentials/i.test(m))setMessage('E-Mail oder Passwort ist falsch.',true);else if(/email not confirmed/i.test(m))setMessage('Die E-Mail-Adresse wurde noch nicht bestätigt.',true);else if(/already registered/i.test(m))setMessage('Für diese E-Mail existiert bereits ein Konto. Bitte anmelden.',true);else setMessage(m,true)}finally{submit.disabled=false;modeButton.disabled=false;forgot.disabled=false}});
modeButton.addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
forgot.addEventListener('click',async()=>{if(!db){setMessage('Verbindung wird noch hergestellt…',true);return}const em=document.getElementById('email').value.trim().toLowerCase();if(!em){setMessage('Bitte zuerst deine E-Mail-Adresse eingeben.',true);return}forgot.disabled=true;try{const r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;setMessage('Wenn ein Konto mit dieser E-Mail existiert, wurde der Passwort-Reset angefordert.')}catch(err){setMessage(String(err?.message||err),true)}finally{forgot.disabled=false}});
document.getElementById('logoutButton').addEventListener('click',async()=>{if(db)await db.auth.signOut();gameScreen.style.display='none';authScreen.style.display='flex';form.reset();setMode('login')});
setMode('login');boot();
})();
</script>
</body>
</html>
