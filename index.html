<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>MAFIVERA – The Real World</title><link rel="icon" href="./assets/mafivera-logo.webp"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 10%,#252a30 0,#0b0f13 45%,#030507 100%);z-index:9000}.auth-card{width:min(430px,100%);padding:26px 22px;background:rgba(8,12,16,.97);border:1px solid #39424b;border-radius:22px;box-shadow:0 24px 80px #000}.auth-logo{text-align:center}.auth-logo img{width:min(290px,85%)}h1{text-align:center;margin:10px 0 5px}.subtitle{text-align:center;color:#9aa5af;font-size:14px}.field{margin-top:12px}.field label{display:block;color:#aeb7bf;font-size:12px;font-weight:700;margin:0 0 6px 3px}.field input{width:100%;height:50px;border:1px solid #3a444e;border-radius:12px;background:#0a0e12;color:#fff;padding:0 14px;font-size:16px}.password-wrap{position:relative;width:100%}.password-wrap input{padding-right:58px}.auth-card button{width:100%;height:50px;margin-top:15px;border-radius:12px;border:0;font-weight:800}.auth-card .password-wrap .password-toggle{position:absolute;right:4px;top:4px;width:42px!important;height:42px!important;min-width:42px!important;margin:0!important;padding:0!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#fff!important;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;z-index:3;cursor:pointer}.auth-card .password-wrap .password-toggle:focus{outline:2px solid rgba(214,173,45,.55);outline-offset:-2px}.primary{background:#d6ad2d;color:#111}.secondary{background:#202831;color:#fff}.link{background:transparent;color:#9aa5af}.message{min-height:22px;text-align:center;margin-top:10px;color:#d6ad2d;font-size:13px}.foot{text-align:center;color:#58636d;font-size:10px;margin-top:14px}.game-root{position:fixed;inset:0;display:none;overflow:hidden}@media(max-width:480px){.auth-screen{padding:16px}.auth-card{padding:25px 18px}.auth-card h1{font-size:28px}.subtitle{font-size:13px}.field input{height:50px}.auth-card .password-wrap .password-toggle{right:4px;top:4px}}</style></head><body><section id="authScreen" class="auth-screen"><div class="auth-card"><div class="auth-logo"><img src="./assets/mafivera-logo.webp" alt="MAFIVERA"></div><h1 id="authTitle">Willkommen zurück</h1><p id="authSubtitle" class="subtitle">Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.</p><form id="authForm"><div class="field"><label>E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Passwort</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="passwordToggle" class="password-toggle" type="button" aria-label="Passwort anzeigen" title="Passwort anzeigen">👁️</button></div></div><div id="usernameField" class="field hidden"><label>Nutzername</label><input id="username" type="text" maxlength="24"></div><button id="submitButton" class="primary" type="submit">🔐 Anmelden</button></form><button id="modeButton" class="secondary" type="button">📝 Registrieren</button><button id="forgotButton" class="link" type="button">Passwort vergessen?</button><div id="authMessage" class="message"></div><div class="foot">MAFIVERA · THE REAL WORLD</div></div></section><section id="gameRoot" class="game-root"></section><script>(()=>{'use strict';const URL='https://ufqdntsxgqcxtszufbtv.supabase.co',KEY='sb_publishable_PDao9J9Pz87uSotESNeGbg_GSGh5u49',auth=document.getElementById('authScreen'),root=document.getElementById('gameRoot'),form=document.getElementById('authForm'),email=document.getElementById('email'),password=document.getElementById('password'),username=document.getElementById('username'),uf=document.getElementById('usernameField'),submit=document.getElementById('submitButton'),modeBtn=document.getElementById('modeButton'),forgot=document.getElementById('forgotButton'),msg=document.getElementById('authMessage'),title=document.getElementById('authTitle'),sub=document.getElementById('authSubtitle');let mode='login',db;const say=(t,e=false)=>{msg.textContent=t;msg.style.color=e?'#ff8585':'#d6ad2d'};document.getElementById('passwordToggle').onclick=()=>{password.type=password.type==='password'?'text':'password'};const load=s=>new Promise((ok,bad)=>{const x=document.createElement('script');x.src=s;x.onload=ok;x.onerror=bad;document.body.appendChild(x)});const game=async s=>{if(!s?.user)return;auth.style.display='none';root.style.display='block';if(window.__mtrwGameBooted)return;window.__mtrwGameBooted=true;try{await load('./heist-system.js?v=43');await load('./game.js?v=43');await load('./buildings.js?v=43');await load('./territory-rules.js?v=43');await load('./mafivera-final-renderer.js?v=43')}catch(e){window.__mtrwGameBooted=false;auth.style.display='flex';root.style.display='none';say('Spiel konnte nicht gestartet werden: '+(e.message||e),true)}};form.onsubmit=async e=>{e.preventDefault();const em=email.value.trim().toLowerCase(),pw=password.value;if(!db)return say('Verbindung wird noch hergestellt…',true);if(!em||pw.length<8)return say('Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.',true);submit.disabled=true;try{if(mode==='register'){const n=username.value.trim();if(!/^[A-Za-z0-9_.-]{3,24}$/.test(n))throw Error('Nutzername muss 3–24 Zeichen lang sein.');const r=await db.auth.signUp({email:em,password:pw,options:{data:{username:n}}});if(r.error)throw r.error;await game(r.data.session)}else{const r=await db.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;await game(r.data.session)}}catch(e){say(/invalid login/i.test(e.message)?'E-Mail oder Passwort ist falsch.':e.message,true)}finally{submit.disabled=false}};modeBtn.onclick=()=>{mode=mode==='login'?'register':'login';const r=mode==='register';uf.classList.toggle('hidden',!r);username.required=r;title.textContent=r?'Konto erstellen':'Willkommen zurück';sub.textContent=r?'Erstelle deinen neuen MAFIVERA-Spieler.':'Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.';submit.textContent=r?'🚀 Registrieren':'🔐 Anmelden';modeBtn.textContent=r?'↩️ Zur Anmeldung':'📝 Registrieren';forgot.classList.toggle('hidden',r);say('')};forgot.onclick=async()=>{const em=email.value.trim().toLowerCase();if(!em)return say('Bitte E-Mail-Adresse eingeben.',true);const r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});say(r.error?r.error.message:'Passwort-Reset wurde angefordert.',!!r.error)};window.addEventListener('error',e=>console.error('[MAFIVERA]',e.error||e.message));window.addEventListener('unhandledrejection',e=>console.error('[MAFIVERA]',e.reason));(async()=>{try{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){await load('https://unpkg.com/@supabase/supabase-js@2')}db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.db=db;const s=await db.auth.getSession();if(s.data.session)return game(s.data.session);db.auth.onAuthStateChange((_,s)=>{if(s)game(s)})}catch(e){say('Verbindung konnte nicht hergestellt werden.',true)}})()})();</script></body></html>
