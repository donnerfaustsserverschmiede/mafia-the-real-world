<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>MAFIA — The Real World</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101010;color:#eee;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{z-index:1000;background:#151515;border-bottom:1px solid #333;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#999;font-size:10px;letter-spacing:.14em}.stats{display:flex;gap:12px}.stat{font-size:11px;color:#aaa;text-align:center}.stat b{display:block;color:#fff;font-size:14px}.map{flex:1;min-height:0}.panel{position:absolute;z-index:1100;left:12px;right:12px;bottom:12px;max-width:460px;background:rgba(18,18,18,.97);border:1px solid #3b3b3b;border-radius:16px;padding:14px;box-shadow:0 10px 35px #0009;max-height:72vh;overflow:auto}.panel h2{font-size:17px;margin:0 0 4px}.muted{font-size:13px;color:#aaa;line-height:1.4}.row{display:flex;gap:8px}.row>*{flex:1}button{width:100%;min-height:44px;border:0;border-radius:10px;padding:10px 14px;margin-top:10px;font-weight:800;cursor:pointer}.primary{background:#d1a72c;color:#111}.secondary{background:#333;color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:#bbb;margin-top:8px;min-height:18px}.section{border-top:1px solid #333;margin-top:12px;padding-top:12px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#999;font-weight:800;margin-bottom:7px}.building{background:#202020;border:1px solid #383838;border-radius:11px;padding:10px;margin-top:7px}.building strong{display:block}.building span{font-size:12px;color:#aaa}.building button{margin-top:7px;min-height:38px}.leaflet-control-attribution{font-size:9px}.leaflet-container{background:#ddd}@media(max-width:600px){.top{padding:8px}.stats{gap:7px}.stats .stat:nth-child(3){display:none}.panel{left:8px;right:8px;bottom:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🕴️ MAFIA <small>THE REAL WORLD · v0.2</small></div><div class="stats"><div class="stat">💵<b id="money">$1.000</b></div><div class="stat">⭐<b id="rep">0</b></div><div class="stat">🏴<b id="territory">0</b></div></div></header>
<main id="map" class="map"></main>
<section class="panel">
<h2 id="zoneTitle">Standort wird ermittelt…</h2>
<div id="zoneInfo" class="muted">Erlaube den Standortzugriff. Dein Standort wird für die Spielmechanik benötigt.</div>
<div class="row"><button id="claim" class="primary" disabled>🏴 Gebiet übernehmen</button><button id="locate" class="secondary">📍 Standort</button></div>
<div id="status" class="status" aria-live="polite"></div>
<div id="buildings" class="section" hidden><div class="section-title">🏗️ Gebäude</div><div id="buildingList"></div></div>
</section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([51.1657,10.4515],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const size=.0025;
let marker=null,current=null,watchId=null,accuracyCircle=null,gridLayer=L.layerGroup().addTo(map);
let state=JSON.parse(localStorage.getItem('mtrw_state')||'null')||{money:1000,rep:0,owned:{}};
const buildingDefs={
  warehouse:{name:'📦 Lagerhaus',cost:500,rep:5,desc:'Erhöht deine Lagerkapazität.'},
  barracks:{name:'🪖 Kaserne',cost:750,rep:10,desc:'Bereitet später Truppenproduktion vor.'},
  fortress:{name:'🏰 Festung',cost:1500,rep:20,desc:'Verstärkt die Verteidigung des Gebiets.'},
  laundering:{name:'💰 Geldwäsche',cost:1200,rep:15,desc:'Erzeugt später sauberes Spielgeld aus illegalen Einnahmen.'},
  hideout:{name:'🕴️ Gang-Versteck',cost:900,rep:12,desc:'Basis für deine Mafia-Aktivitäten.'}
};
function save(){localStorage.setItem('mtrw_state',JSON.stringify(state))}
function key(lat,lng){return Math.floor(lat/size)+':'+Math.floor(lng/size)}
function boundsFor(k){const [a,b]=k.split(':').map(Number);return [[a*size,b*size],[(a+1)*size,(b+1)*size]]}
function drawGrid(){gridLayer.clearLayers();if(!current)return;const [a,b]=current.split(':').map(Number);for(let x=a-4;x<=a+4;x++)for(let y=b-4;y<=b+4;y++){const k=x+':'+y;const r=L.rectangle(boundsFor(k),{color:state.owned[k]?'#d1a72c':'#555',weight:state.owned[k]?2:1,fillColor:state.owned[k]?'#d1a72c':'#999',fillOpacity:state.owned[k]?.22:.025,interactive:false});r.addTo(gridLayer)}}
function moneyText(){return '$'+state.money.toLocaleString('de-DE')}
function updateStats(){document.getElementById('money').textContent=moneyText();document.getElementById('rep').textContent=state.rep;document.getElementById('territory').textContent=Object.keys(state.owned).length}
function updateBuildings(){const box=document.getElementById('buildings'),list=document.getElementById('buildingList');if(!current||!state.owned[current]){box.hidden=true;return}box.hidden=false;const buildings=state.owned[current].buildings||{};list.innerHTML='';Object.entries(buildingDefs).forEach(([id,b])=>{const built=!!buildings[id];const el=document.createElement('div');el.className='building';el.innerHTML='<strong>'+b.name+(built?' ✓':'')+'</strong><span>'+b.desc+'</span>'+(!built?'<button class="primary">🏗️ Bauen · '+moneyText(b.cost)+'</button>':'<div class="muted" style="margin-top:6px">Gebäude aktiv.</div>');if(!built)el.querySelector('button').onclick=()=>build(id);list.appendChild(el)})}
function update(lat,lng){current=key(lat,lng);const mine=!!state.owned[current];document.getElementById('zoneTitle').textContent='Gebiet '+current;document.getElementById('zoneInfo').textContent=mine?'Dieses Gebiet gehört deiner Mafia-Familie.':'Neutrales Gebiet. Du befindest dich darin und kannst es übernehmen.';document.getElementById('claim').disabled=mine;drawGrid();updateBuildings()}
function build(id){if(!current||!state.owned[current])return;const b=buildingDefs[id],data=state.owned[current];data.buildings=data.buildings||{};if(data.buildings[id])return;if(state.money<b.cost){document.getElementById('status').textContent='Nicht genug Geld für dieses Gebäude.';return}state.money-=b.cost;state.rep+=b.rep;data.buildings[id]=Date.now();save();updateStats();updateBuildings();drawGrid();document.getElementById('status').textContent=b.name+' wurde errichtet.'}
function locate(){const s=document.getElementById('status');if(!navigator.geolocation){s.textContent='Standortzugriff wird von diesem Browser nicht unterstützt.';return}s.textContent='Standort wird angefragt…';if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{const {latitude,longitude,accuracy}=p.coords;if(!marker)marker=L.marker([latitude,longitude]).addTo(map).bindPopup('👤 Deine Position');marker.setLatLng([latitude,longitude]);if(accuracyCircle)accuracyCircle.setLatLng([latitude,longitude]).setRadius(accuracy);else accuracyCircle=L.circle([latitude,longitude],{radius:accuracy,color:'#3388ff',fillOpacity:.05,weight:1}).addTo(map);if(!current){map.setView([latitude,longitude],17);marker.openPopup()}update(latitude,longitude);s.textContent='Standort aktiv · Genauigkeit ca. '+Math.round(accuracy)+' m'},e=>{s.textContent=e.code===1?'Standortzugriff verweigert. Bitte in den Browser-Einstellungen erlauben.':'Standort konnte nicht ermittelt werden. Für GPS bitte HTTPS verwenden.'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
document.getElementById('locate').onclick=()=>{if(marker)map.setView(marker.getLatLng(),17);else locate()};
document.getElementById('claim').onclick=()=>{if(!current||state.owned[current])return;state.owned[current]={claimedAt:Date.now(),buildings:{}};state.money+=100;state.rep+=10;save();updateStats();update(current.split(':')[0]*size,current.split(':')[1]*size);document.getElementById('zoneInfo').textContent='Gebiet übernommen. Deine Mafia kontrolliert jetzt dieses Quadrat.';document.getElementById('status').textContent='Gebiet erfolgreich übernommen. +$100 · +10 Reputation'};
updateStats();locate();
</script>
</body>
</html>
