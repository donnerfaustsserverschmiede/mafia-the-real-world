name: Discord Changelog

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            title="${RELEASE_NAME:-Neue Version}"
            version="${TAG_NAME:-Release}"
            url="$RELEASE_URL"
            commits=$(git log -1 --pretty=format:'%H%x09%s%x09%an' "$SHA")
          else
            title="Neue Änderungen"
            version=""
            url="https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              commits=$(git log -10 --no-merges --pretty=format:'%H%x09%s%x09%an' "$SHA")
            else
              commits=$(git log --no-merges --pretty=format:'%H%x09%s%x09%an' "$BEFORE..$SHA" || true)
            fi
          fi

          features=""
          fixes=""
          changes=""
          versions=""

          while IFS=$'\t' read -r hash subject author; do
            [[ -z "${subject:-}" ]] && continue
            link="https://github.com/${GITHUB_REPOSITORY}/commit/${hash}"
            item="• [${subject}](<${link}>) — ${author}"

            if [[ "$subject" =~ ^(feat|feature)(\(.+\))?: ]]; then
              features+="$item"$'\n'
            elif [[ "$subject" =~ ^(fix|bugfix)(\(.+\))?: ]]; then
              fixes+="$item"$'\n'
            elif [[ "$subject" =~ ^(release|version)(\(.+\))?: ]] || [[ "$subject" =~ [vV][0-9]+\.[0-9]+ ]]; then
              versions+="$item"$'\n'
            else
              changes+="$item"$'\n'
            fi
          done <<< "$commits"

          [[ -n "$features" ]] || features="Keine neuen Funktionen."
          [[ -n "$fixes" ]] || fixes="Keine Fehlerbehebungen."
          [[ -n "$changes" ]] || changes="Keine weiteren Änderungen."

          export TITLE="$title" VERSION="$version" URL="$url" FEATURES="$features" FIXES="$fixes" VERSIONS="$versions" CHANGES="$changes"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          def clip(value, limit=1000):
              value = value.strip()
              return value if len(value) <= limit else value[:limit-1] + '…'

          fields = []
          if os.environ.get('VERSION'):
              fields.append({'name': '🚀 Version', 'value': clip(os.environ['VERSION']), 'inline': True})
          if os.environ.get('VERSIONS', '').strip():
              fields.append({'name': '📦 Version / Release', 'value': clip(os.environ['VERSIONS']), 'inline': False})
          fields.append({'name': '✨ Neue Funktionen', 'value': clip(os.environ['FEATURES']), 'inline': False})
          fields.append({'name': '🐛 Fehlerbehebungen', 'value': clip(os.environ['FIXES']), 'inline': False})
          fields.append({'name': '🔧 Änderungen', 'value': clip(os.environ['CHANGES']), 'inline': False})

          payload = {
              'username': 'Mafia – The Real World',
              'embeds': [{
                  'title': f'📋 Changelog · {os.environ["TITLE"]}',
                  'url': os.environ['URL'],
                  'description': 'Automatisch aus den Änderungen im Repository erstellt.',
                  'fields': fields,
                  'footer': {'text': 'Mafia – The Real World · Automatischer Changelog'},
                  'timestamp': datetime.now(timezone.utc).isoformat()
              }],
              'allowed_mentions': {'parse': []}
          }

          with open('/tmp/discord-payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Publish changelog to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_CHANGELOG_WEBHOOK:-}" ]]; then
            echo 'DISCORD_CHANGELOG_WEBHOOK is not configured.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            --data-binary @/tmp/discord-payload.json \
            "$DISCORD_CHANGELOG_WEBHOOK"
