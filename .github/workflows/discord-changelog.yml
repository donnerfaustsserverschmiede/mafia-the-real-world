name: Discord Changelog

on:
  push:
    branches: [main, V1]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog erstellen
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            version="${TAG_NAME:-}"
            commits=$(git log -1 --pretty=format:'%s' "$SHA")
          else
            version=""
            if [[ -f VERSION.md ]]; then
              version=$(grep -m1 -oE 'V[0-9]+([.][0-9]+)*' VERSION.md || true)
            fi
            version="${version:-${BRANCH_NAME}}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              commits=$(git log -10 --no-merges --pretty=format:'%s' "$SHA")
            else
              commits=$(git log --no-merges --pretty=format:'%s' "$BEFORE..$SHA" || true)
            fi
          fi
          changes=""
          while IFS= read -r subject; do
            [[ -z "${subject:-}" ]] && continue
            clean="$subject"
            for prefix in 'feat: ' 'feature: ' 'fix: ' 'bugfix: ' 'release: ' 'version: ' 'chore: ' 'refactor: ' 'docs: ' 'style: ' 'perf: ' 'test: ' 'ci: ' 'build: '; do clean="${clean#${prefix}}"; done
            clean="${clean//real-world map/echte Weltkarte}"
            clean="${clean//real map/echte Weltkarte}"
            clean="${clean//auth/Anmeldung}"
            clean="${clean//login/Anmeldung}"
            clean="${clean//register/Registrierung}"
            clean="${clean//logging/Protokollierung}"
            clean="${clean//Discord logging/Discord-Protokollierung}"
            changes+="• ${clean}"$'\n'
          done <<< "$commits"
          [[ -n "$changes" ]] || changes="• Keine Änderungen"
          export VERSION="$version" CHANGES="$changes"
          python3 - <<'PY'
          import json, os
          def clip(v, n=1500):
              v=v.strip()
              return v if len(v)<=n else v[:n-1]+'…'
          version=os.environ.get('VERSION','').strip() or 'main'
          message=(
              f'📋 **Changelog · MAFIVERA**\n\n'
              f'**Version {version}**\n\n'
              f'**Änderungen:**\n'
              f'{clip(os.environ["CHANGES"])}\n\n'
              f'**Hinweis:** MAFIVERA wird weiterhin entwickelt.\n'
              f'Euer Feedback, Vorschläge und Ideen gern in #vorschläge-und-ideen\n'
              f'(https://discord.com/channels/1549525247760400384/1549686789076295770)'
          )
          payload={'username':'MAFIVERA Changelog','content':message,'allowed_mentions':{'parse':[]}}
          with open('/tmp/discord-payload.json','w',encoding='utf-8') as f:
              json.dump(payload,f,ensure_ascii=False)
          PY
      - name: Changelog an Discord senden
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_CHANGELOG_WEBHOOK:-}" ]]; then echo 'DISCORD_CHANGELOG_WEBHOOK is not configured.'; exit 1; fi
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' -X POST --data-binary @/tmp/discord-payload.json "$DISCORD_CHANGELOG_WEBHOOK"
