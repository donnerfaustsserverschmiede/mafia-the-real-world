name: Inject real-world map layer
on:
  push:
    paths:
      - 'places.js'
      - 'gps.js'
      - 'auth-fix.js'
      - 'supabase/places.sql'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject map and authentication integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="gridLayer=L.layerGroup().addTo(map);"
          expose="gridLayer=L.layerGroup().addTo(map);window.map=map;window.gridLayer=gridLayer;window.getMtrwState=()=>({user,profile,marker,territories:window.territories||[]});"
          if marker in s and 'window.getMtrwState' not in s:
              s=s.replace(marker,expose)
          hook='updateZone(latitude,longitude);'
          replacement='updateZone(latitude,longitude);window.updateZoneReal?.(latitude,longitude);'
          if hook in s and 'window.updateZoneReal?.(latitude,longitude)' not in s:
              s=s.replace(hook,replacement,1)
          tag='<script src="./places.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          gps='<script src="./gps.js"></script>'
          if gps not in s:
              s=s.replace('</body>',gps+'\n</body>')
          auth='<script src="./auth-fix.js?v=2"></script>'
          if auth not in s:
              s=s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',auth+'\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: harden authentication boot and login'
          git push
