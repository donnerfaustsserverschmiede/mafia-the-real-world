name: Inject real-world map layer
on:
  push:
    paths:
      - '.github/workflows/patch-real-map.yml'
      - 'places.js'
      - 'gps.js'
      - 'presence.js'
      - 'logs.js'
      - 'auth-fix.js'
      - 'guest-safety.js'
      - 'google-auth.js'
      - 'email-auth.js'
      - 'assets/mafivera-brand.js'
      - 'assets/mafivera-logo.webp'
      - 'manifest.webmanifest'
      - 'supabase/places.sql'
      - 'supabase/world_production.sql'
      - 'supabase/functions/world-tile/index.ts'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize global map, GPS, logging, authentication and MAFIVERA branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>MAFIA — The Real World</title>','<title>MAFIVERA – Die Welt gehört dir</title>')
          s=s.replace('<div class="logo">🕴️ MAFIA</div><div class="sub">THE REAL WORLD</div>','<div class="logo"><img src="./assets/mafivera-logo.webp" alt="MAFIVERA"></div>')
          s=s.replace('🕴️ MAFIA <small>THE REAL WORLD · v0.7</small>','MAFIVERA <small>DIE WELT GEHÖRT DIR · v0.7</small>')
          marker="gridLayer=L.layerGroup().addTo(map);"
          expose="gridLayer=L.layerGroup().addTo(map);window.map=map;window.gridLayer=gridLayer;window.getMtrwState=()=>({user,profile,marker,territories:window.territories||[]});"
          if marker in s and 'window.getMtrwState' not in s:
              s=s.replace(marker,expose,1)
          hook='updateZone(latitude,longitude);'
          replacement='updateZone(latitude,longitude);window.updateZoneReal?.(latitude,longitude);window.mtrwGpsEmit?.(latitude,longitude,accuracy);'
          if hook in s and 'window.mtrwGpsEmit?.(latitude,longitude,accuracy)' not in s:
              s=s.replace(hook,replacement,1)
          s=s.replace('async function startGame(session){','window.startGame=async function startGame(session){',1)
          s=re.sub(r'\(async\(\)=>\{try\{const\{data\}=await db\.auth\.getSession\(\);if\(data\.session\)await startGame\(data\.session\)\}catch\(e\)\{console\.error\(e\)\}\}\)\(\);', '', s)
          for name in ['auth-fix','guest-safety','google-auth','places','gps','presence','logs','email-auth','assets/mafivera-brand']:
              s=re.sub(r'<script src="\./'+re.escape(name)+r'\.js\?v=\d+"></script>\s*', '', s)
          s=re.sub(r'<script defer src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2"></script><script defer src="https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.js"></script><script>window\.addEventListener\("DOMContentLoaded",\(\)=>\{', '<script>window.addEventListener("DOMContentLoaded",async()=>{', s, count=1)
          s=s.replace("'use strict';\nconst SUPABASE_URL=", "'use strict';\nconst loadExternal=(src)=>new Promise((resolve,reject)=>{const x=document.createElement('script');x.src=src;x.async=true;x.onload=resolve;x.onerror=()=>reject(new Error('CDN konnte nicht geladen werden: '+src));document.head.appendChild(x)});\nconst ensureLib=async(test,urls,label)=>{if(test())return true;for(const u of urls){try{await loadExternal(u);if(test())return true}catch(e){console.warn('[MAFIVERA] '+label+' CDN fehlgeschlagen',u)}}return false};\nif(!await ensureLib(()=>!!window.supabase,['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2','https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js'],'Supabase')){document.getElementById('startMessage').textContent='Verbindung konnte nicht hergestellt werden. Bitte Seite neu laden.';return;}\nif(!await ensureLib(()=>!!window.L,['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'],'Leaflet')){document.getElementById('startMessage').textContent='Die Kartenbibliothek konnte nicht geladen werden. Bitte Seite neu laden.';return;}\nconst SUPABASE_URL=")
          s=s.replace('</body>','<script src="./places.js?v=14"></script>\n<script src="./gps.js?v=14"></script>\n<script src="./presence.js?v=1"></script>\n<script src="./logs.js?v=1"></script>\n<script src="./email-auth.js?v=4"></script>\n<script src="./assets/mafivera-brand.js?v=2"></script>\n</body>')
          old="const message=(el,t)=>{el.textContent=t||''};"
          new="const message=(el,t)=>{const target=(el&&el.isConnected?el:null)||document.getElementById('emailAuthMessage')||el||document.getElementById('startMessage');if(target)target.textContent=t||''};"
          if old in s:
              s=s.replace(old,new,1)
          blocking="message(startMessage,'Gebiete werden geladen…');await Promise.race([loadTerritories(),new Promise((_,reject)=>setTimeout(()=>reject(Error('Gebiete konnten nicht geladen werden. Bitte prüfe die Supabase-Verbindung.')),10000))]);startBox.hidden=true;game.hidden=false;document.getElementById('status').textContent='Spiel geladen.';"
          nonblocking="startBox.hidden=true;game.hidden=false;document.getElementById('status').textContent='Spiel geladen.';Promise.resolve().then(()=>loadTerritories()).catch(e=>console.warn('[MTRW] Legacy-Gebiete konnten nicht geladen werden; Weltkarte läuft trotzdem:',e));window.mtrwGameEvent?.('Spiel gestartet',{version:'0.7'});"
          if blocking in s:
              s=s.replace(blocking,nonblocking,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: robuste CDN-Ladung für MAFIVERA'
          git push
