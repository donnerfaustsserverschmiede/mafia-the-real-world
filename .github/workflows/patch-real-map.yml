name: Inject real-world map layer
on:
  push:
    paths:
      - 'places.js'
      - 'supabase/places.sql'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject map integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);window.db=db;'
          expose="const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);window.db=db;"
          if marker in s and 'window.map=map' not in s:
              s=s.replace(marker,expose+'window.map=map;window.gridLayer=gridLayer;window.getMtrwState=()=>({user,profile,marker,territories:window.territories||[]});')
          tag='<script src="./places.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: integrate real-world OSM map layer'
          git push
