name: Inject real-world map layer
on:
  push:
    paths:
      - 'places.js'
      - 'gps.js'
      - 'auth-fix.js'
      - 'guest-safety.js'
      - 'supabase/places.sql'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject real-world map and guest profile integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker="gridLayer=L.layerGroup().addTo(map);"
          expose="gridLayer=L.layerGroup().addTo(map);window.map=map;window.gridLayer=gridLayer;window.getMtrwState=()=>({user,profile,marker,territories:window.territories||[]});"
          if marker in s and 'window.getMtrwState' not in s:
              s=s.replace(marker,expose)
          hook='updateZone(latitude,longitude);'
          replacement='updateZone(latitude,longitude);window.updateZoneReal?.(latitude,longitude);'
          if hook in s and 'window.updateZoneReal?.(latitude,longitude)' not in s:
              s=s.replace(hook,replacement,1)
          if '<script src="./places.js' not in s:
              s=s.replace('</body>','<script src="./places.js?v=10"></script>\n</body>')
          if '<script src="./gps.js' not in s:
              s=s.replace('</body>','<script src="./gps.js?v=10"></script>\n</body>')
          s=re.sub(r'<script src="\./auth-fix\.js\?v=\d+"></script>\s*', '', s)
          if './guest-safety.js' not in s:
              s=s.replace('</body>','<script src="./guest-safety.js?v=1"></script>\n</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: remove legacy auth injection and add guest safety'
          git push