name: Inject real-world map layer
on:
  push:
    paths:
      - 'places.js'
      - 'gps.js'
      - 'auth-fix.js'
      - 'guest-safety.js'
      - 'google-auth.js'
      - 'email-auth.js'
      - 'supabase/places.sql'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize game startup and authentication integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker="gridLayer=L.layerGroup().addTo(map);"
          expose="gridLayer=L.layerGroup().addTo(map);window.map=map;window.gridLayer=gridLayer;window.getMtrwState=()=>({user,profile,marker,territories:window.territories||[]});"
          if marker in s and 'window.getMtrwState' not in s:
              s=s.replace(marker,expose,1)
          hook='updateZone(latitude,longitude);'
          replacement='updateZone(latitude,longitude);window.updateZoneReal?.(latitude,longitude);'
          if hook in s and 'window.updateZoneReal?.(latitude,longitude)' not in s:
              s=s.replace(hook,replacement,1)
          s=s.replace('async function startGame(session){','window.startGame=async function startGame(session){',1)
          s=re.sub(r'<script src="\\./auth-fix\\.js\\?v=\\d+"></script>\s*', '', s)
          s=re.sub(r'<script src="\\./guest-safety\\.js\\?v=\\d+"></script>\s*', '', s)
          s=re.sub(r'<script src="\\./google-auth\\.js\\?v=\\d+"></script>\s*', '', s)
          s=re.sub(r'<script src="\\./email-auth\\.js\\?v=\\d+"></script>\s*', '', s)
          if '<script src="./places.js' not in s:
              s=s.replace('</body>','<script src="./places.js?v=10"></script>\n</body>')
          if '<script src="./gps.js' not in s:
              s=s.replace('</body>','<script src="./gps.js?v=10"></script>\n</body>')
          s=s.replace('</body>','<script src="./email-auth.js?v=2"></script>\n</body>')
          old='const message=(el,t)=>{el.textContent=t||\'\'};'
          new="const message=(el,t)=>{const target=(el&&el.isConnected?el:null)||document.getElementById('emailAuthMessage')||el||document.getElementById('startMessage');if(target)target.textContent=t||'';};"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: sync visible auth startup status'
          git push