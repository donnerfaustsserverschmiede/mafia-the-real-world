name: Deploy MTRW Supabase world service
on:
  push:
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/world-tile/**'
      - 'supabase/functions/game-logs/**'
      - 'supabase/world_production.sql'
      - 'supabase/places_production.sql'
      - 'supabase/logs_production.sql'
      - 'supabase/radar_players_social_invites_and_business_tasks.sql'
      - 'supabase/v1_production_social.sql'
      - 'supabase/admin_player_map_location.sql'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deployment secrets are not configured."
            exit 1
          fi
      - name: Apply world database schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/world-query.json
          import json
          print(json.dumps({'query': open('supabase/world_production.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/world-query.json
      - name: Apply V1 production and social schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v1-query.json
          import json
          print(json.dumps({'query': open('supabase/v1_production_social.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/v1-query.json
      - name: Apply places database schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/places-query.json
          import json
          print(json.dumps({'query': open('supabase/places_production.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/places-query.json
      - name: Apply logging database schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/logs-query.json
          import json
          print(json.dumps({'query': open('supabase/logs_production.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/logs-query.json
      - name: Apply radar and social schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/radar-social-query.json
          import json
          print(json.dumps({'query': open('supabase/radar_players_social_invites_and_business_tasks.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/radar-social-query.json
      - name: Apply admin player map location schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/admin-player-map-query.json
          import json
          print(json.dumps({'query': open('supabase/admin_player_map_location.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/admin-player-map-query.json
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy world tile function
        run: supabase functions deploy world-tile --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy game log function
        run: supabase functions deploy game-logs --project-ref "$SUPABASE_PROJECT_REF"
