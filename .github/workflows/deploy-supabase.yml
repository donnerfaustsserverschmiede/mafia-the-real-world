name: Deploy MTRW Supabase world service
on:
  push:
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/world-tile/**'
      - 'supabase/world_production.sql'
      - 'supabase/places_production.sql'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deployment secrets are not configured."
            exit 1
          fi
      - name: Apply world database schema
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @- <<'JSON'
          {
            "query": "$(python - <<'PY'
          import json
          print(json.dumps(open('supabase/world_production.sql', encoding='utf-8').read())[1:-1])
          PY
          )"
          }
          JSON
      - name: Apply places database schema
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/query.json
          import json
          print(json.dumps({'query': open('supabase/places_production.sql', encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/query.json
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy world tile function
        run: supabase functions deploy world-tile --project-ref "$SUPABASE_PROJECT_REF"
