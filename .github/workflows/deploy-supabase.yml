name: Deploy MTRW Supabase world service
on:
  push:
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/world-tile/**'
      - 'supabase/world_production.sql'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deployment secrets are not configured; skipping deployment."
            exit 0
          fi
      - name: Link project
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy world tile function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: supabase functions deploy world-tile --project-ref "$SUPABASE_PROJECT_REF"
