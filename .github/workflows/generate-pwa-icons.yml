name: Generate MAFIVERA PWA icons

on:
  push:
    branches: [main]
    paths:
      - "assets/mafivera-logo.webp"
      - "manifest.webmanifest"
      - ".github/workflows/generate-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Render the existing MAFIVERA logo with Chrome
        run: |
          cat > /tmp/mtrw-icon.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><style>
          html,body{margin:0;width:100%;height:100%;background:#05080d;overflow:hidden}
          body{display:flex;align-items:center;justify-content:center}
          img{display:block;width:100%;height:100%;object-fit:contain}
          </style></head>
          <body><img src="file:///home/runner/work/mafia-the-real-world/mafia-the-real-world/assets/mafivera-logo.webp"></body>
          </html>
          HTML

          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=192,192 \
            --screenshot="$GITHUB_WORKSPACE/assets/mafivera-icon-192.png" \
            "file:///tmp/mtrw-icon.html"

          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=512,512 \
            --screenshot="$GITHUB_WORKSPACE/assets/mafivera-icon-512.png" \
            "file:///tmp/mtrw-icon.html"

      - name: Verify icon dimensions
        run: |
          file assets/mafivera-icon-192.png
          file assets/mafivera-icon-512.png

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mafivera-icon-192.png assets/mafivera-icon-512.png
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Generate proper MAFIVERA PWA icon sizes"
          git push
