name: Generate MAFIVERA PWA icons

on:
  push:
    branches: [main]
    paths:
      - "assets/mafivera-logo.webp"
      - "manifest.webmanifest"
      - ".github/workflows/generate-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate 192px and 512px PNG icons
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("assets/mafivera-logo.webp").convert("RGBA")
          for size, name in [(192, "assets/mafivera-icon-192.png"), (512, "assets/mafivera-icon-512.png")]:
              img = src.resize((size, size), Image.Resampling.LANCZOS)
              img.save(name, "PNG", optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mafivera-icon-192.png assets/mafivera-icon-512.png
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Generate proper MAFIVERA PWA icon sizes"
          git push
