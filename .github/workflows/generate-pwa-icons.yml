name: Generate MAFIVERA PWA icons

on:
  push:
    branches: [main]
    paths:
      - "assets/mafivera-logo.webp"
      - "manifest.webmanifest"
      - ".github/workflows/generate-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate 192px and 512px PNG icons
        run: |
          ffmpeg -y -i assets/mafivera-logo.webp -vf scale=192:192:flags=lanczos -frames:v 1 assets/mafivera-icon-192.png
          ffmpeg -y -i assets/mafivera-logo.webp -vf scale=512:512:flags=lanczos -frames:v 1 assets/mafivera-icon-512.png
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mafivera-icon-192.png assets/mafivera-icon-512.png
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Generate proper MAFIVERA PWA icon sizes"
          git push
