name: Deploy MAFIVERA to itch.io

on:
  push:
    branches: [main, V4]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAFIVERA
        uses: actions/checkout@v4

      - name: Prepare web build
        run: |
          mkdir -p dist
          rsync -a ./ ./dist/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='supabase/' \
            --exclude='google-sites/' \
            --exclude='dist/' \
            --exclude='*.zip'

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./dist tdonnerfaust/mafivera:html --userversion "MAFIVERA-${{ github.ref_name }}-${{ github.sha }}"
