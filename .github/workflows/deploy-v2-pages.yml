name: Deploy MAFIVERA V1 to GitHub Pages

on:
  push:
    branches: [main, V1]
    paths-ignore:
      - '.github/workflows/discord-changelog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1
        uses: actions/checkout@v4
        with:
          ref: V1
      - name: Install Discord logging bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./logs.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload V1 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V1
        id: deployment
        uses: actions/deploy-pages@v4
