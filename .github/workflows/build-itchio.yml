name: Build and publish MAFIVERA to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release
        uses: actions/checkout@v4

      - name: Prepare HTML5 build
        run: |
          set -euo pipefail
          rm -rf dist/itch
          mkdir -p dist/itch
          rsync -a ./ dist/itch/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'supabase/' \
            --exclude '*.sql'
          test -f dist/itch/index.html

      - name: Install Butler
        run: |
          set -euo pipefail
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o /tmp/butler.zip
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          echo "/tmp/butler" >> "$GITHUB_PATH"

      - name: Validate HTML5 build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          butler validate dist/itch

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY"
          butler push dist/itch tdonnerfaust/mafivera:html5
